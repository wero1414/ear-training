name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    # Same image and architecture as `npm run snapshots:linux`, so the recorded Linux
    # screenshots compare pixel for pixel.
    runs-on: ubuntu-24.04-arm
    container: mcr.microsoft.com/playwright:v1.63.0-noble
    steps:
      - name: Install git (the site file list comes from git ls-files)
        run: apt-get update -qq && apt-get install -y -qq git > /dev/null
      - uses: actions/checkout@v4
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: npm ci
      - run: npm run lint
      - run: npx vitest run
      - run: npx playwright test
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results
          path: test-results/
          retention-days: 7

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # No build: this copies the site files (tools/site.mjs) so tests and recorded
      # snapshots are not published.
      - run: node tools/stage-site.mjs _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
